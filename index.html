<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checklists | Mobile 4.0</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#e2e8f0;font:14px system-ui}main{max-width:700px;margin:auto;padding:16px}header{text-align:center;border-bottom:1px solid #30425e;padding:16px}h1{letter-spacing:3px;margin:0;color:white}small{color:#94a3b8}section{background:#142034;border:1px solid #293b55;border-radius:12px;padding:12px;margin:12px 0}input,button{font:inherit;border-radius:7px;padding:10px;border:1px solid #40516b;color:inherit;background:#1e293b}input{width:100%;margin-top:8px}table{width:100%;border-collapse:collapse;table-layout:fixed}th,td{padding:5px 2px;text-align:center;border-bottom:1px solid #30425e}th:first-child,td:first-child{text-align:left;width:31%;overflow-wrap:anywhere}td button{width:100%;padding:9px 1px;margin:2px 0;font-size:12px;cursor:pointer}.buy{color:#4ade80}.sell{color:#f87171}.buy.on{background:#15803d;color:white}.sell.on{background:#b91c1c;color:white}.lateral{color:#fff}.lateral.on{background:#fff;color:#0b1220}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;justify-content:space-between;text-align:center}.stats b{display:block;font-size:26px}.bar{display:flex;height:12px;background:#334155;border-radius:8px;overflow:hidden;margin:16px 0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}button{cursor:pointer}.share{background:#166534}#bias{text-align:center;font-weight:bold;font-size:18px}#history article{border-top:1px solid #40516b;padding:10px 0}#history button{margin:4px}footer{color:#94a3b8;font-size:12px} @media(max-width:380px){main{padding:8px}section{padding:8px}td button{font-size:11px}}thead select{width:100%;min-width:0;background:#1e293b;color:#e2e8f0;border:1px solid #40516b;border-radius:7px;padding:8px 1px;font:inherit;font-size:11px}</style><main><header><h1>Checklists</h1><p>MOBILE 4.0</p><small>CONFLUÊNCIA MULTITEMPORAL</small></header><section><small id="clock"></small><label for="asset">Ativo</label><input id="asset" placeholder="MNQ, WIN, USTEC..." maxlength="40"></section><section><table><thead><tr><th>CONTEXTO</th><th><select id="time0" aria-label="Tempo gráfico 1" onchange="changeTime(0,this.value)"></select></th><th><select id="time1" aria-label="Tempo gráfico 2" onchange="changeTime(1,this.value)"></select></th><th><select id="time2" aria-label="Tempo gráfico 3" onchange="changeTime(2,this.value)"></select></th></tr></thead><tbody id="matrix"></tbody><tfoot><tr><th>RESULTADO</th><td id="r0"></td><td id="r1"></td><td id="r2"></td></tr></tfoot></table></section><section><div class="stats"><div class="buy">Compra<b id="cp">0%</b><small id="cn"></small></div><div class="sell">Venda<b id="vp">0%</b><small id="vn"></small></div><div class="lateral">Lateral<b id="lp">0%</b><small id="ln"></small></div><div>Pendentes<b id="pending">12</b></div></div><div class="bar"><div id="green" style="background:#16a34a"></div><div id="white" style="background:#fff"></div><div id="red" style="background:#dc2626"></div></div><div id="bias"></div><p id="grade" style="text-align:center"></p></section><section class="actions"><button onclick="resetAll()">Nova análise</button><button onclick="save()">Salvar análise</button><button class="share" onclick="share()">WhatsApp</button><button onclick="copyResult()">Copiar resultado</button></section><section><h3>Histórico local</h3><div id="history"></div></section><footer><span id="roles"></span><p>Pesos iguais. Confluência mínima sugerida: 75%. Não validada por backtest; não representa probabilidade de acerto.</p></footer></main><script>const rows=['Estrutura','Fibonacci','Médias Móveis','Suporte/Resistência'], options=['Mensal','Semanal','Diário','4 Horas','1 Hora','15 Min','3 Min','2 Min'], defaults=['1 Hora','15 Min','2 Min'];let times=[...defaults];let vals=Array(12).fill(null), history=[];const $=id=>document.getElementById(id);try{history=JSON.parse(localStorage.getItem('warHistory')||'[]');if(!Array.isArray(history))history=[]}catch(e){}function clock(){$('clock').textContent=new Date().toLocaleString('pt-BR')+' • ';}clock();setInterval(clock,1000);function syncTimes(){times.forEach((t,j)=>{$('time'+j).value=t});$('roles').textContent=times[0]+': tendência • '+times[1]+': confirmação • '+times[2]+': gatilho.'}function changeTime(j,t){if(!options.includes(t)||times[j]===t)return;times[j]=t;vals=vals.map((v,k)=>k%3===j?null:v);draw()}function draw(){syncTimes(); $('matrix').innerHTML=rows.map((r,i)=>`<tr><th>${r}</th>${times.map((t,j)=>{let k=i*3+j;return `<td><button aria-label="${r} ${t} Compra" aria-pressed="${vals[k]===1}" class="buy ${vals[k]===1?'on':''}" onclick="pick(${k},1)">▲ Compra</button><button aria-label="${r} ${t} Venda" aria-pressed="${vals[k]===-1}" class="sell ${vals[k]===-1?'on':''}" onclick="pick(${k},-1)">▼ Venda</button><button aria-label="${r} ${t} Lateral" aria-pressed="${vals[k]===0}" class="lateral ${vals[k]===0?'on':''}" onclick="pick(${k},0)">— Lateral</button></td>`}).join('')}</tr>`).join('');let s=summary();for(let j=0;j<3;j++){let a=vals.filter((_,k)=>k%3===j),sum=a.reduce((x,y)=>x+y,0);$('r'+j).textContent=a.includes(null)?'PENDENTE':sum>0?'COMPRA':sum<0?'VENDA':'LATERAL';$('r'+j).className=a.includes(null)?'':sum>0?'buy':sum<0?'sell':'lateral'} $('cp').textContent=pct(s.c);$('vp').textContent=pct(s.v);$('cn').textContent=s.c+' de 12';$('vn').textContent=s.v+' de 12';$('lp').textContent=pct(s.l);$('ln').textContent=s.l+' de 12';$('pending').textContent=12-s.c-s.v-s.l;$('white').style.width=s.l/12*100+'%';$('green').style.width=s.c/12*100+'%';$('red').style.width=s.v/12*100+'%';$('bias').textContent=s.bias;$('bias').className=s.c+s.v+s.l===12?(s.c>=9?'buy':s.v>=9?'sell':''):'';$('grade').textContent=s.grade}function pct(n){return (n/12*100).toLocaleString('pt-BR',{maximumFractionDigits:1})+'%'}function summary(){let c=vals.filter(x=>x===1).length,v=vals.filter(x=>x===-1).length,l=vals.filter(x=>x===0).length,m=Math.max(c,v),done=c+v+l===12;return {c,v,l,bias:!done?'AGUARDANDO ANÁLISE':c>=9?'FAVORÁVEL À COMPRA':v>=9?'FAVORÁVEL À VENDA':l===12?'LATERAL':'BAIXA CONFLUÊNCIA',grade:!done?'Análise incompleta':m===12?'Máxima':m>=10?'Muito forte':m===9?'Forte':m>=7?'Moderada':'Fraca'}}function pick(k,v){vals[k]=vals[k]===v?null:v;draw()}function resetAll(){vals.fill(null);$('asset').value='';draw()}function result(){let s=summary();return 'Checklists | MOBILE 4.0\n'+new Date().toLocaleString('pt-BR')+'\nAtivo: '+($('asset').value||'Não informado')+'\nContexto | '+times.join(' | ')+'\n'+rows.map((r,i)=>r+' | '+vals.slice(i*3,i*3+3).map(v=>v===1?'🟢 C':v===-1?'🔴 V':v===0?'⚪ L':'—').join(' | ')).join('\n')+'\nCompra: '+pct(s.c)+' | Venda: '+pct(s.v)+' | Lateral: '+pct(s.l)+' | Pendentes: '+(12-s.c-s.v-s.l)+'\n'+s.bias+'\nConfluência: '+s.grade}function share(){window.open('https://wa.me/?text='+encodeURIComponent(result()),'_blank','noopener')}async function copyResult(){try{await navigator.clipboard.writeText(result());alert('Resultado copiado.')}catch(e){prompt('Copie o resultado:',result())}}function save(){if(vals.includes(null)){alert('Preencha os 12 contextos antes de salvar.');return}history.unshift({version:4,times:[...times],asset:$('asset').value,date:new Date().toLocaleString('pt-BR'),vals:[...vals],bias:summary().bias});try{localStorage.setItem('warHistory',JSON.stringify(history));alert('Análise salva neste navegador.')}catch(e){alert('Histórico disponível apenas nesta sessão.')}renderHistory()}function renderHistory(){let el=$('history');el.replaceChildren();if(!history.length){el.textContent='Nenhuma análise salva.';return}history.forEach((h,i)=>{let a=document.createElement('article'),t=document.createElement('div');t.textContent=(h.asset||'Sem ativo')+' • '+h.date+' • '+h.bias+' • '+(h.times||defaults).join(' / ');a.append(t);let b=document.createElement('button');b.textContent='Abrir';b.onclick=()=>{vals=h.vals.map(v=>(h.version===3||h.version===4)?v:v===0?null:v);times=Array.isArray(h.times)&&h.times.length===3&&h.times.every(t=>options.includes(t))?[...h.times]:[...defaults];$('asset').value=h.asset;draw();window.scrollTo(0,0)};a.append(b);let d=document.createElement('button');d.textContent='Excluir';d.onclick=()=>{if(confirm('Excluir esta análise?')){history.splice(i,1);try{localStorage.setItem('warHistory',JSON.stringify(history))}catch(e){}renderHistory()}};a.append(d);el.append(a)})}for(let j=0;j<3;j++){$('time'+j).innerHTML=options.map(t=>`<option>${t}</option>`).join('')}draw();renderHistory();</script></html>
